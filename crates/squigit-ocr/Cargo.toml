[package]
name = "squigit-ocr"
version = "0.1.0"
edition = "2021"
build = "embed.rs"

[dependencies]
anyhow = "1"
dirs = "6"
flate2 = "1.1.9"
fs2 = "0.4"
futures-util = "0.3"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4.44"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.37", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[build-dependencies]
flate2 = "1.1.9"
sha2 = "0.10"
tar = "0.4.44"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
