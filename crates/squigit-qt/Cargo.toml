[package]
name = "squigit-qt"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
fs2 = "0.4"
serde_json = "1"
squigit-ocr = { path = "../squigit-ocr" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

