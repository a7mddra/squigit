[package]
name = "squigit-qt"
version = "0.1.0"
edition = "2021"
build = false

[features]
development = []

[dependencies]
anyhow = "1.0"
dirs = "5.0"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
opener = "0.8"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
rqrr = "0.11"
serde_json = "1"
squigit-ocr = { path = "../squigit-ocr" }
url = "2"
