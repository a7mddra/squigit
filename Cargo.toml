[workspace]
resolver = "2"

[package]
name = "squigit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "squigit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
fs2 = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
panic = "abort"
