[package]
name = "squigit"
version = "0.1.0"
edition = "2021"

[features]
development = ["squigit-qt/development", "squigit-ocr/staged-runtime"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
dirs = "5"
fs2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4.19"
keyring = "4.2"
opener = { version = "0.8", features = ["reveal"] }
rodio = { version = "=0.20.1", default-features = false, features = ["mp3", "wav"] }
rand = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "2259d0c82af372dbb4d43dfd5989f72c44d152be" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "2259d0c82af372dbb4d43dfd5989f72c44d152be" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
squigit-ocr = { path = "../crates/squigit-ocr" }
squigit-qt = { path = "../crates/squigit-qt" }
tempfile = "3"
tokio = { version = "1.37", features = ["rt-multi-thread", "sync"] }
toml = "0.9"
url = "2.5"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
