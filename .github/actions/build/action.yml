name: "Build Squigit"
description: "Builds OCR and Qt independently, then embeds OCR and packages the Rust application"
inputs:
  target:
    description: "Rust host target triple"
    required: true
  distro:
    description: "Linux distribution for the shared builder image (ubuntu or fedora)"
    default: "ubuntu"
runs:
  using: "composite"
  steps:
    - name: Install Rust
      if: runner.os != 'Linux'
      uses: dtolnay/rust-toolchain@stable

    - name: Prepare Linux builder
      if: runner.os == 'Linux'
      shell: bash
      env:
        BUILD_DISTRO: ${{ inputs.distro }}
        BUILD_IMAGE: squigit-screenshot-builder-${{ inputs.distro }}
      run: |
        set -euo pipefail
        docker build -t "$BUILD_IMAGE" -f "docker/Dockerfile.$BUILD_DISTRO" .

    - name: Build OCR runtime
      uses: ./.github/actions/build-ocr
      with:
        target: ${{ inputs.target }}
        distro: ${{ inputs.distro }}

    - name: Build Qt runtime
      uses: ./.github/actions/build-qt
      with:
        distro: ${{ inputs.distro }}

    - name: Build and package application (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
        BUILD_IMAGE: squigit-screenshot-builder-${{ inputs.distro }}
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD:/build" -w /build \
          -e CARGO_HTTP_MULTIPLEXING=false \
          -e SQUIGIT_BUILD_TARGET="$BUILD_TARGET" \
          "$BUILD_IMAGE" bash -c 'cargo xtask build --app && "binaries/$SQUIGIT_BUILD_TARGET/squigit" --version'
        for path in target binaries; do
          if [ -e "$path" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$path"
          fi
        done

    - name: Build and package application (macOS and Windows)
      if: runner.os != 'Linux'
      shell: bash
      run: cargo xtask build --app

    - name: Sign application (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        codesign --force --options runtime --timestamp=none --sign - "binaries/$BUILD_TARGET/squigit"

    - name: Check application version (macOS and Windows)
      if: runner.os != 'Linux'
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        executable="binaries/$BUILD_TARGET/squigit"
        if [ "$RUNNER_OS" = "Windows" ]; then executable="$executable.exe"; fi
        "$executable" --version
